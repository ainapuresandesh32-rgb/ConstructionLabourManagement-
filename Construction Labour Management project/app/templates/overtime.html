{% extends "base.html" %}{% block content %}<h1>⏱️ Overtime</h1><form class="panel inlineform" method="post" action="/overtime/add"><select name="labour_id">{% for x in labours %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><select name="site_id">{% for x in sites %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="hours" type="number" step=".5" placeholder="Hours" required><input name="rate" type="number" step=".01" placeholder="Rate/hour" required><input name="reason" placeholder="Reason"><button>Add Overtime</button></form><div class="panel"><table><tr><th>Date</th><th>Labour</th><th>Hours</th><th>Rate</th><th>Total</th></tr>{% for x in rows %}<tr><td>{{x.day}}</td><td>{{x.labour.name}}</td><td>{{x.hours}}</td><td>₹{{x.rate}}</td><td>₹{{x.hours*x.rate}}</td></tr>{% endfor %}</table></div>{% endblock %}
