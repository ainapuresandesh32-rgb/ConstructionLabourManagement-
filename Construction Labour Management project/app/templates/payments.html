{% extends "base.html" %}{% block content %}<h1>💳 Payments</h1><form class="panel inlineform" method="post" action="/payments/add"><select name="labour_id">{% for x in labours %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="amount" type="number" step=".01" placeholder="Amount" required><select name="method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option></select><input name="reference" placeholder="Reference"><button>Record Payment</button></form><div class="panel"><table><tr><th>Date</th><th>Labour</th><th>Amount</th><th>Method</th><th>Reference</th></tr>{% for x in payments %}<tr><td>{{x.day}}</td><td>{{x.labour.name}}</td><td>₹{{x.amount}}</td><td>{{x.method}}</td><td>{{x.reference}}</td></tr>{% endfor %}</table></div>{% endblock %}
