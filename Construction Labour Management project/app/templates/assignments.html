{% extends "base.html" %}{% block content %}<h1>👥 Labour-Site Assignment</h1><form class="panel inlineform" method="post" action="/assignments/add"><select name="labour_id">{% for x in labours %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><select name="site_id">{% for x in sites %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="role" placeholder="Role" required><button>Assign</button></form><div class="panel"><table><tr><th>Labour</th><th>Site</th><th>Role</th><th>Status</th></tr>{% for x in rows %}<tr><td>{{x.labour.name}}</td><td>{{x.site.name}}</td><td>{{x.role}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
