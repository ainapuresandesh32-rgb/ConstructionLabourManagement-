{% extends "base.html" %}{% block content %}<h1>💵 Labour Advance</h1><form class="panel inlineform" method="post" action="/advance/add"><select name="labour_id">{% for x in labours %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><input name="amount" type="number" step=".01" placeholder="Amount" required><input name="reason" placeholder="Reason"><button>Add Advance</button></form><div class="panel"><table><tr><th>Date</th><th>Labour</th><th>Amount</th><th>Deducted</th><th>Balance</th></tr>{% for x in advances %}<tr><td>{{x.day}}</td><td>{{x.labour.name}}</td><td>₹{{x.amount}}</td><td>₹{{x.deducted}}</td><td>₹{{x.amount-x.deducted}}</td></tr>{% endfor %}</table></div>{% endblock %}
