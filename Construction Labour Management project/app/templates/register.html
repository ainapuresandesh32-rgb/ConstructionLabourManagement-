<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/style.css"><title>Register</title></head><body class="auth"><form class="authbox" method="post"><h1>Create Account</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<input name="name" placeholder="Full Name" required><input name="email" type="email" placeholder="Email" required><input name="mobile" placeholder="Mobile"><input name="password" type="password" placeholder="Password" minlength="6" required><button>Register</button><p>Already registered? <a href="/login">Login</a></p></form></body></html>
