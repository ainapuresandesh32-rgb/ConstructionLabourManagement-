{% extends "base.html" %}{% block content %}<h1>👷 Labour Management</h1><div class="grid2"><form class="panel" method="post" action="/labour/add"><h3>Add Labour</h3><input name="name" placeholder="Full Name" required><input name="mobile" placeholder="Mobile"><select name="labour_type"><option>Mason</option><option>Helper</option><option>Electrician</option><option>Plumber</option><option>Painter</option><option>Carpenter</option><option>Welder</option><option>Machine Operator</option><option>Other</option></select><input name="skill" placeholder="Skill" required><input name="daily_wage" type="number" step="0.01" placeholder="Daily Wage" required><button>Add Labour</button></form><div class="panel"><h3>Workers</h3><table><tr><th>Name</th><th>Type</th><th>Skill</th><th>Wage</th><th></th></tr>{% for x in labours %}<tr><td>{{x.name}}</td><td>{{x.labour_type}}</td><td>{{x.skill}}</td><td>₹{{x.daily_wage}}</td><td><form method="post" action="/labour/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
