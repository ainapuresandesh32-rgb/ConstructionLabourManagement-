{% extends "base.html" %}{% block content %}<h1>🏗️ Construction Sites</h1><div class="grid2"><form class="panel" method="post" action="/sites/add"><h3>Add Site</h3><input name="name" placeholder="Site Name" required><input name="client_name" placeholder="Client Name"><input name="address" placeholder="Address"><input name="budget" type="number" step="0.01" placeholder="Project Budget"><button>Add Site</button></form><div class="panel"><h3>Sites</h3><table><tr><th>Site</th><th>Client</th><th>Budget</th><th>Status</th><th></th></tr>{% for x in sites %}<tr><td>{{x.name}}</td><td>{{x.client_name}}</td><td>₹{{x.budget}}</td><td>{{x.status}}</td><td><form method="post" action="/sites/{{x.id}}/delete"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div></div>{% endblock %}
