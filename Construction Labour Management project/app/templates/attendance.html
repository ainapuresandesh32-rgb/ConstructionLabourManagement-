{% extends "base.html" %}{% block content %}<h1>🕘 Attendance</h1><form class="panel inlineform" method="post" action="/attendance/add"><select name="labour_id">{% for x in labours %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><select name="site_id">{% for x in sites %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><select name="status"><option>Present</option><option>Absent</option><option>Half Day</option><option>Leave</option><option>Holiday</option></select><input name="overtime_hours" type="number" step=".5" placeholder="OT hours"><button>Mark Today</button></form><div class="panel"><table><tr><th>Date</th><th>Labour</th><th>Site</th><th>Status</th><th>OT</th></tr>{% for x in rows %}<tr><td>{{x.day}}</td><td>{{x.labour.name}}</td><td>{{x.labour.owner.sites[0].name if x.labour.owner.sites else "-"}}</td><td>{{x.status}}</td><td>{{x.overtime_hours}}</td></tr>{% endfor %}</table></div>{% endblock %}
